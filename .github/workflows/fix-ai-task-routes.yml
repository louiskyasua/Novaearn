name: Fix AI task routes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate task admin routes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          def dedupe_route(lines, marker):
              starts = [i for i, line in enumerate(lines) if line.strip() == marker]
              if len(starts) <= 1:
                  return lines
              # Remove every duplicate block, keeping the first registered route.
              for start in reversed(starts[1:]):
                  end = start + 1
                  while end < len(lines) and not lines[end].lstrip().startswith('@app.route('):
                      end += 1
                  del lines[start:end]
              return lines

          lines = dedupe_route(lines, '@app.route("/admin/task-proof/<int:submission_id>")')
          lines = dedupe_route(lines, '@app.route("/admin/update-task/<int:submission_id>/<action>", methods=["POST"])')
          path.write_text(''.join(lines), encoding='utf-8')
          PY
      - name: Verify
        run: |
          python -m py_compile app.py task_verifier.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert text.count('@app.route("/admin/task-proof/<int:submission_id>")') == 1, 'task-proof route count is wrong'
          assert text.count('@app.route("/admin/update-task/<int:submission_id>/<action>", methods=["POST"])') == 1, 'update-task route count is wrong'
          print('AI task admin routes: OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Fix duplicate AI task admin routes"; git push; fi
