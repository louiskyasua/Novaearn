<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nova Earn · Account Activation</title>
  <style>
    :root{--green:#0d7a4d;--green2:#12a765;--bg:#ecfff5;--card:#fff;--text:#123127;--muted:#557267;--line:#cfe9dc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,var(--bg),#dff8eb);color:var(--text);display:grid;place-items:center;padding:24px}
    .wrap{width:min(620px,100%)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 20px 50px rgba(12,88,58,.12)}
    .eyebrow{margin:0 0 10px;color:var(--green);font-size:.78rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:0 0 12px;font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;letter-spacing:-.04em}
    p{line-height:1.65}.muted{color:var(--muted)}
    .status{margin:20px 0;padding:16px;border-radius:15px;background:linear-gradient(135deg,var(--green),var(--green2));color:white;font-weight:800;display:flex;align-items:center;gap:12px}
    .spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite;flex:none}
    .details{display:none;margin-top:20px}
    .account{padding:18px;border:1px solid var(--line);border-radius:16px;background:#f7fffb}
    .account .label{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:var(--green);margin-bottom:7px}
    .account .number{font-size:1.25rem;font-weight:800}
    .btn{display:inline-flex;align-items:center;justify-content:center;margin-top:18px;padding:13px 18px;border-radius:12px;background:var(--green);color:white;text-decoration:none;font-weight:850}
    .small{font-size:.9rem}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <p class="eyebrow">ACCOUNT ACTIVATION</p>
      <h1>Activate Your Account</h1>

      <div class="status" id="status">
        <span class="spinner" aria-hidden="true"></span>
        <span>GENERATING ACCOUNT TO TRANSFER</span>
      </div>

      <div class="details" id="details">
        <div class="account">
          <div class="label">Payment Details</div>
          <div class="number">Payment destination is configured by the administrator.</div>
          <p class="small muted">Use only the payment details displayed through Nova Earn's official, verified payment configuration.</p>
        </div>
      </div>

      <a class="btn" href="{{ url_for('dashboard') }}">Return to Dashboard</a>
    </section>
  </main>

  <script>
    setTimeout(function () {
      document.getElementById('status').style.display = 'none';
      document.getElementById('details').style.display = 'block';
    }, 2200);
  </script>
</body>
</html>
