name: Maintain account activation locks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activation-locks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure activation backend controls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          if "activated INTEGER DEFAULT 0" not in text:
              old = '''            role TEXT DEFAULT 'user'\n        );'''
              new = '''            role TEXT DEFAULT 'user',\n            activated INTEGER DEFAULT 0\n        );'''
              if old not in text:
                  raise SystemExit("Could not add activated column")
              text = text.replace(old, new, 1)

          if 'ALTER TABLE users ADD COLUMN activated INTEGER DEFAULT 0' not in text:
              marker = '''    if "role" not in user_columns:\n        c.execute("ALTER TABLE users ADD COLUMN role TEXT DEFAULT 'user'")\n'''
              addition = marker + '''    if "activated" not in user_columns:\n        c.execute("ALTER TABLE users ADD COLUMN activated INTEGER DEFAULT 0")\n'''
              if marker not in text:
                  raise SystemExit("Could not find user migration")
              text = text.replace(marker, addition, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify templates are syntactically safe
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader, StrictUndefined

          env = Environment(loader=FileSystemLoader("templates"), undefined=StrictUndefined)
          for name in ["referral.html", "investments.html", "withdraw.html", "activate.html"]:
              env.get_template(name)
              print(f"OK: {name}")
          PY

      - name: Commit backend-only changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No backend changes needed"
          else
            git commit -m "Maintain account activation backend controls"
            git push
          fi
