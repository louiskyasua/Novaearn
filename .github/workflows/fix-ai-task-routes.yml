name: Fix AI task routes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate task admin routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          def keep_first_route_block(source, decorator):
              marker = f'@app.route("{decorator}")'
              starts = [m.start() for m in re.finditer(re.escape(marker), source)]
              if len(starts) <= 1:
                  return source

              # Keep the first complete route block and remove later duplicate
              # blocks up to the next top-level Flask route decorator.
              for start in reversed(starts[1:]):
                  next_route = re.search(r'\n@app\.route\(', source[start + len(marker):])
                  end = start + len(marker) + next_route.start() + 1 if next_route else len(source)
                  source = source[:start] + source[end:]
              return source

          text = keep_first_route_block(text, '/admin/task-proof/<int:submission_id>')
          text = keep_first_route_block(text, '/admin/update-task/<int:submission_id>/<action>')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify
        run: |
          python -m py_compile app.py task_verifier.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert text.count('@app.route("/admin/task-proof/<int:submission_id>")') == 1
          assert text.count('@app.route("/admin/update-task/<int:submission_id>/<action>"') == 1
          print('AI task admin routes: OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Fix duplicate AI task admin routes"; git push; fi
