name: Add AI task verifier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch backend and admin UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          if 'from task_verifier import TASKS, analyze_submission' not in text:
              marker = 'from config import ALLOWED_PAYMENT_PROVIDERS, PAYMENT_ACCOUNTS\n'
              if marker not in text:
                  raise SystemExit('Import marker not found')
              text = text.replace(marker, marker + 'from task_verifier import TASKS, analyze_submission\n', 1)

          if 'TASK_UPLOAD_DIR' not in text:
              marker = 'UPLOAD_DIR = os.environ.get("NOVA_UPLOAD_DIR", os.path.join(DATA_DIR, "deposit_proofs"))\n'
              addition = marker + 'TASK_UPLOAD_DIR = os.environ.get("NOVA_TASK_UPLOAD_DIR", os.path.join(DATA_DIR, "task_proofs"))\nos.makedirs(TASK_UPLOAD_DIR, exist_ok=True)\nMAX_TASK_PROOF_SIZE = 2 * 1024 * 1024\nALLOWED_TASK_PROOF_EXTENSIONS = {"jpg", "jpeg", "png", "webp"}\n'
              if marker not in text:
                  raise SystemExit('Upload marker not found')
              text = text.replace(marker, addition, 1)

          if '"submit_task"' not in text:
              marker = '        "admin_update_withdrawal",\n'
              if marker not in text:
                  raise SystemExit('CSRF marker not found')
              text = text.replace(marker, marker + '        "submit_task",\n        "admin_update_task",\n', 1)

          if 'CREATE TABLE IF NOT EXISTS task_submissions' not in text:
              marker = '''        CREATE TABLE IF NOT EXISTS transactions(\n            id INTEGER PRIMARY KEY AUTOINCREMENT,\n            user_id INTEGER NOT NULL,\n            kind TEXT,\n            amount INTEGER,\n            note TEXT,\n            created_at TEXT\n        );\n'''
              addition = marker + '''        CREATE TABLE IF NOT EXISTS task_submissions(\n            id INTEGER PRIMARY KEY AUTOINCREMENT,\n            user_id INTEGER NOT NULL,\n            task_key TEXT NOT NULL,\n            reward INTEGER NOT NULL,\n            proof_path TEXT NOT NULL,\n            status TEXT DEFAULT 'pending',\n            ai_status TEXT DEFAULT 'needs_review',\n            ai_confidence REAL DEFAULT 0,\n            ai_reason TEXT,\n            created_at TEXT,\n            reviewed_at TEXT,\n            UNIQUE(user_id, task_key)\n        );\n'''
              if marker not in text:
                  raise SystemExit('Database marker not found')
              text = text.replace(marker, addition, 1)

          if '@app.route("/tasks")' not in text:
              marker = '@app.route("/activate")\n@login_required\ndef activate():\n'
              block = '''@app.route("/tasks")\n@login_required\ndef tasks():\n    u = current()\n    c = db()\n    rows = c.execute(\n        "SELECT * FROM task_submissions WHERE user_id=? ORDER BY id DESC",\n        (u["id"],),\n    ).fetchall()\n    c.close()\n    submissions = {row["task_key"]: row for row in rows}\n    return render_template("tasks.html", tasks=TASKS, submissions=submissions, user=u)\n\n\n@app.route("/tasks/submit", methods=["POST"])\n@login_required\ndef submit_task():\n    task_key = request.form.get("task_key", "").strip()\n    task = TASKS.get(task_key)\n    proof = request.files.get("proof")\n    if not task or not proof or not proof.filename:\n        flash("Select a valid task and screenshot.")\n        return redirect(url_for("tasks"))\n\n    extension = proof.filename.rsplit(".", 1)[-1].lower() if "." in proof.filename else ""\n    if extension not in ALLOWED_TASK_PROOF_EXTENSIONS:\n        flash("Proof must be JPG, PNG, or WebP.")\n        return redirect(url_for("tasks"))\n\n    safe_name = secrets.token_hex(16) + "." + extension\n    proof_path = os.path.join(TASK_UPLOAD_DIR, safe_name)\n    proof.save(proof_path)\n    if os.path.getsize(proof_path) > MAX_TASK_PROOF_SIZE:\n        os.remove(proof_path)\n        flash("Proof image is too large. Maximum size is 2 MB.")\n        return redirect(url_for("tasks"))\n\n    u = current()\n    c = db()\n    try:\n        existing = c.execute(\n            "SELECT id, status FROM task_submissions WHERE user_id=? AND task_key=?",\n            (u["id"], task_key),\n        ).fetchone()\n        if existing:\n            c.rollback()\n            os.remove(proof_path)\n            flash("You have already submitted this task.")\n            return redirect(url_for("tasks"))\n\n        ai = analyze_submission(task_key, proof_path)\n        c.execute(\n            """\n            INSERT INTO task_submissions(\n                user_id,task_key,reward,proof_path,status,ai_status,ai_confidence,ai_reason,created_at\n            ) VALUES(?,?,?,?,?,?,?,?,?)\n            """,\n            (\n                u["id"],\n                task_key,\n                task["reward"],\n                proof_path,\n                "pending",\n                ai["status"],\n                ai["confidence"],\n                ai["reason"],\n                datetime.now().isoformat(),\n            ),\n        )\n        c.commit()\n    except Exception:\n        c.rollback()\n        if os.path.exists(proof_path):\n            os.remove(proof_path)\n        flash("Unable to submit task proof.")\n        return redirect(url_for("tasks"))\n    finally:\n        c.close()\n    flash("Proof submitted. AI verification result is available to the admin reviewer.")\n    return redirect(url_for("tasks"))\n\n\n'''
              if marker not in text:
                  raise SystemExit('Activation route marker not found')
              text = text.replace(marker, block + marker, 1)

          if 'task_submissions=task_submissions' not in text:
              marker = '''    wd = c.execute(\n        """\n        SELECT w.*, u.name\n        FROM withdrawals w\n        JOIN users u ON u.id=w.user_id\n        ORDER BY w.id DESC\n        """\n    ).fetchall()\n    c.close()\n'''
              replacement = marker[:-len('    c.close()\n')] + '''    task_submissions = c.execute(\n        """\n        SELECT ts.*, u.name, u.email\n        FROM task_submissions ts\n        JOIN users u ON u.id=ts.user_id\n        ORDER BY ts.id DESC\n        """\n    ).fetchall()\n    c.close()\n'''
              if marker not in text:
                  raise SystemExit('Admin query marker not found')
              text = text.replace(marker, replacement, 1)

              marker2 = '''        withdrawals=wd,\n    )\n\n\n@app.route("/admin/deposit-proof/<int:deposit_id>")\n'''
              replacement2 = '''        withdrawals=wd,\n        task_submissions=task_submissions,\n        tasks=TASKS,\n    )\n\n\n@app.route("/admin/task-proof/<int:submission_id>")\n@admin_required\ndef admin_task_proof(submission_id):\n    c = db()\n    row = c.execute("SELECT proof_path FROM task_submissions WHERE id=?", (submission_id,)).fetchone()\n    c.close()\n    if not row or not row["proof_path"]:\n        abort(404)\n    filename = os.path.basename(row["proof_path"])\n    return send_from_directory(TASK_UPLOAD_DIR, filename, as_attachment=False)\n\n\n@app.route("/admin/update-task/<int:submission_id>/<action>", methods=["POST"])\n@admin_required\ndef admin_update_task(submission_id, action):\n    if action not in {"approve", "reject"}:\n        flash("Invalid task action.")\n        return redirect(url_for("admin"))\n    c = db()\n    try:\n        submission = c.execute(\n            "SELECT * FROM task_submissions WHERE id=?", (submission_id,)\n        ).fetchone()\n        if not submission or submission["status"] != "pending":\n            c.rollback()\n            flash("Task submission is no longer pending.")\n            return redirect(url_for("admin"))\n        status = "approved" if action == "approve" else "rejected"\n        result = c.execute(\n            "UPDATE task_submissions SET status=?, reviewed_at=? WHERE id=? AND status='pending'",\n            (status, datetime.now().isoformat(), submission_id),\n        )\n        if result.rowcount != 1:\n            c.rollback()\n            flash("Task submission is no longer pending.")\n            return redirect(url_for("admin"))\n        if action == "approve":\n            c.execute(\n                "UPDATE users SET balance=balance+? WHERE id=?",\n                (submission["reward"], submission["user_id"]),\n            )\n            c.execute(\n                """\n                INSERT INTO transactions(user_id,kind,amount,note,created_at)\n                VALUES(?,?,?,?,?)\n                """,\n                (\n                    submission["user_id"],\n                    "TASK_REWARD",\n                    submission["reward"],\n                    f"Task reward approved: {submission['task_key']}",\n                    datetime.now().isoformat(),\n                ),\n            )\n        c.commit()\n    except Exception:\n        c.rollback()\n        flash("Unable to update task submission.")\n        return redirect(url_for("admin"))\n    finally:\n        c.close()\n    flash(f"Task submission {status}.")\n    return redirect(url_for("admin"))\n\n\n@app.route("/admin/deposit-proof/<int:deposit_id>")\n'''
              if marker2 not in text:
                  raise SystemExit('Admin render marker not found')
              text = text.replace(marker2, replacement2, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Patch admin template
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('templates/admin.html')
          text = path.read_text(encoding='utf-8')
          if 'Task proof submissions' not in text:
              insert = '''\n<section>\n  <div class="sectionhead"><h2>Task proof submissions</h2></div>\n  <div class="table"><table>\n    <tr><th>User</th><th>Task</th><th>Reward</th><th>AI</th><th>Confidence</th><th>Proof</th><th>Date</th><th>Status</th><th>Action</th></tr>\n    {% for s in task_submissions %}<tr>\n      <td>{{ s.name }}</td><td>{{ tasks[s.task_key].title if s.task_key in tasks else s.task_key }}</td><td>₦{{ "{:,}".format(s.reward) }}</td>\n      <td>{{ s.ai_status|replace('_',' ')|title }}</td><td>{{ (s.ai_confidence * 100)|round(0) }}%</td>\n      <td><a class="btn" href="{{ url_for('admin_task_proof', submission_id=s.id) }}" target="_blank" rel="noopener">View proof</a></td>\n      <td>{{ s.created_at[:16] if s.created_at else "—" }}</td><td><span class="status">{{ s.status }}</span></td>\n      <td>{% if s.status == 'pending' %}\n        <form method="post" action="/admin/update-task/{{ s.id }}/approve" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn" type="submit">Approve</button></form>\n        <form method="post" action="/admin/update-task/{{ s.id }}/reject" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn" type="submit">Reject</button></form>\n      {% else %}—{% endif %}</td>\n    </tr>{% else %}<tr><td colspan="9">No task submissions yet.</td></tr>{% endfor %}\n  </table></div>\n</section>\n'''
              text = text.replace('{% endblock %}', insert + '{% endblock %}', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m py_compile app.py task_verifier.py
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader('templates'))
          for name in ['tasks.html', 'admin.html', 'dashboard.html']:
              env.get_template(name)
              print('OK', name)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/admin.html
          if git diff --cached --quiet; then
            echo "No backend/admin changes needed"
          else
            git commit -m "Add AI-assisted task proof verification"
            git push
          fi
